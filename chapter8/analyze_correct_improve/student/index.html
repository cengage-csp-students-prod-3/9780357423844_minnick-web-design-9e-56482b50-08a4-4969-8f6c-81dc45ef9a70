<html lang="en">
<head>
	<title>Form Example</title>
	<meta charset="utf-8">
    <link rel="stylesheet" href="css/styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

	<div id="container">

        <!-- Use the main area to add the main content of the webpage -->
        <main>

            <form class="grid">
                
                <label for="fName">First Name:</label>
                <input type="text" name="fName" id="fName">
                
                <label for="lName">Last Name:</label>
                <input type="text" name="lName" id="lName">
                
                <label for="email">Email:</label>
                <input type="email" name="email" id="email">
                
                <label for="tel">Phone:</label>
                <input type="tel" name="phone" id="phone">
                
                <label for="cName">Credit Card Name:</label>
                <input type="text" name="cName" id="cName">
                
                <label for="cNum">Credit Card Number:</label>
                <input type="number" name="cNum" id="cNum">

                <label for="expDate">Expiration Date:</label>
                <input type="text" name="expDate" id="expDate" placeholder="MM/YY">
                
                <label for="ccv">CCV:</label>
                <input type="number" name="ccv" id="ccv">
            
            </form>

        </main>

        <!-- Use the footer area to add webpage footer content -->
        <footer>
            <p>Hannah Whisenant, Today's Date</p>
        </footer>

	</div>
	
</body>
</html>
